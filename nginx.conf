server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # статика (css/js/img/fonts и т.д.)
    location /assets/ {
        try_files $uri =404;
    }

    # основное приложение (SPA)
    location / {
        try_files $uri /index.html;
    }

    # можно включить gzip, если хочешь
    # gzip on;
    # gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css application/json;
}